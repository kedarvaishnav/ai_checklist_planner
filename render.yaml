# render.yaml
# Render Blueprint — deploys the full stack in one click.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ai-checklist-db
    databaseName: checklist
    user: checklist
    plan: free

services:
  # ── 1. Backend API ─────────────────────────────────────────────────────────
  - type: web
    name: ai-checklist-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-checklist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  # ── 2. Frontend (static site) ─────────────────────────────────────────────
  - type: web
    name: ai-checklist-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
